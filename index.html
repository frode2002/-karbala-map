<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل زائري كربلاء</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, Arial, sans-serif;
}

body{
    background:#f4f4f4;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0f5132,#c8a64b);
    color:white;
    text-align:center;
    padding:35px 20px;
}

header h1{
    font-size:32px;
}

header h2{
    margin-top:10px;
    font-size:22px;
}

header p{
    margin-top:10px;
    font-size:18px;
}

.container{
    width:95%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.search{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    font-size:18px;
    margin-bottom:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.section{
    margin-bottom:35px;
}

.section-title{
    background:#0f5132;
    color:white;
    padding:12px;
    border-radius:10px;
    font-size:22px;
}

.card{
    background:white;
    margin-top:15px;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card h3{
    color:#0f5132;
}

.fa{
    color:#777;
    margin-top:8px;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    background:#0f5132;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}
</style>

</head>

<body>

<header>

<h1>العتبة العباسية المقدسة</h1>

<h2>قسم بين الحرمين الشريفين</h2>

<p>شعبة العوارض</p>

</header>

<div class="container">

<input
class="search"
placeholder="🔍 ابحث عن موقع..."
id="search"
onkeyup="searchSite()">

</div><div class="section">

<h2 class="section-title">🕌 المراقد والمعالم</h2>

<div class="card">
<h3>مرقد الإمام الحسين (ع)</h3>
<div class="fa">حرم امام حسین (ع)</div>
<a class="btn" target="_blank" href="https://maps.app.goo.gl/3x53Kfezit4T1Wuu8?g_st=ic">
📍 فتح الموقع
</a>
</div>

<div class="card">
<h3>مرقد أبي الفضل العباس (ع)</h3>
<div class="fa">حرم حضرت عباس (ع)</div>
<a class="btn" target="_blank" href="https://maps.app.goo.gl/wG3AgZegHrW1A6Kr7?g_st=ic">
📍 فتح الموقع
</a>
</div>

<div class="card">
<h3>التل الزينبي</h3>
<div class="fa">تل زینبیه</div>
<a class="btn" target="_blank" href="https://maps.app.goo.gl/umETTEAmQ6xA33Dt7?g_st=ic">
📍 فتح الموقع
</a>
</div>

</div>

<footer>

دليل المواقع المهمة للزائر

</footer>

<script>

function searchSite(){

let input=document.getElementById("search").value.toLowerCase();

let cards=document.querySelectorAll(".card");

cards.forEach(function(card){

if(card.innerText.toLowerCase().includes(input)){

card.style.display="block";

}else{

card.style.display="none";

}

});

}

</script>

</body>
</html>
